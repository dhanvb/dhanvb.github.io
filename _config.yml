# Site settings
title: "Dhanveer Ahamed Abdul Raheem"
email: dhanveerahamed@gmail.com

description: >-
  Infrastructure and Platform Engineering portfolio covering DevOps,
  DevSecOps, GitOps, Kubernetes and OpenShift, Azure and hybrid cloud,
  automation, workload migration, reliability, cost engineering,
  MLOps platform engineering, and AI-assisted operations.

twitter_username: iamdhanveer
github_username: dhanvb

minimal_mistakes_skin: air
search: true

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes

# URL structure
permalink: /:categories/:title/
timezone: Asia/Dubai

# Additional page directories
include:
  - _pages

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

# Author profile
author:
  name: "Dhanveer Ahamed Abdul Raheem"
  avatar: "/assets/images/bio-photo.jpg"
  bio: "Senior Infrastructure & Platform Engineer"

  links:
    - label: "Website"
      icon: "fas fa-fw fa-link"
      url: "https://dhanvb.github.io"

    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/dhanvb"

    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/dhanveer-ahamed-abdul-raheem-27555958/"

    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:dhanveerahamed@gmail.com"

# Footer
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/dhanvb"

    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:dhanveerahamed@gmail.com"

    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/dhanveer-ahamed-abdul-raheem-27555958/"

# Engineering project collection
collections:
  projects:
    output: true
    permalink: /projects/:path/

# Default layouts
defaults:

  # Engineering articles
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      classes: wide
      author_profile: false
      read_time: true
      comments: true
      share: true
      related: true

  # Standard site pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

  # Engineering project detail pages
  - scope:
      path: ""
      type: projects
    values:
      layout: single
      classes: wide
      author_profile: false
      read_time: true
      comments: true
      share: true
      related: false

# Archives
category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/

# Comments
comments:
  provider: "giscus"

  giscus:
    repo: "dhanvb/dhanvb.github.io"
    repo_id: "R_kgDONXDvRQ"
    category: "General"
    category_id: "DIC_kwDONXDvRc4Ckzq7"
    mapping: "pathname"
    reactions_enabled: true
    emit_metadata: false
    input_position: "bottom"
    theme: "light"
    lang: "en"
